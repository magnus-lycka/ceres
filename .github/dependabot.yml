version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, area:tools]
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: [dependencies, area:tools, area:web]
    groups:
      vitest:
        patterns: ["vitest", "vitest-*", "@vitest/*"]
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
